        <optgroup :label="group">
          <template x-for="store in g" :key="store.id">
            <option :value="store.id" x-text="store.name"></option>
            <hr>

    </select>

    init() {
      this.map = L.map("map").setView([10.41777766582723, 107.2873191383831], 15);

      // 👉 dùng Mapbox (deploy OK)
      // L.tileLayer(
      //   "https://api.mapbox.com/styles/v1/mapbox/light-v11/tiles/512/{z}/{x}/{y}@2x?access_token=YOUR_TOKEN",
      //   {
      //     tileSize: 512,
      //     zoomOffset: -1
      //   }
      // ).addTo(this.map);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap"
      }).addTo(this.map);

      this.stores.forEach(store => {
        const marker = L.marker([store.lat, store.lng]).addTo(this.map);

        marker.bindPopup(`
          <b>${store.name}</b><br>☎ &nbsp; ${store.phone}<br>
          <p>${store.address}</p>
          <a href=${store.linkGoogle} target="_blank" >&#8594; Xem Đường Đi</a>
        `);

        this.markers.push({ marker, store });
      });
    },

    onSelect(e) {
      const id = parseInt(e.target.value);
      const found = this.markers.find(m => m.store.id === id);

      if (found) {
        this.map.flyTo([found.store.lat, found.store.lng], 15);
        found.marker.openPopup();
      }
    },

    get groupedStores() {
      const groups = {};

      this.stores.forEach(store => {
        if (!groups[store.group]) {
          groups[store.group] = [];
        }
        groups[store.group].push(store);
      });

      return groups;
    }
  };
}
</script>
